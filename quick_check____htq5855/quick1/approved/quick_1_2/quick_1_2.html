<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra 1 Quick Check 1.2 - Adjustable A-D Layout</title>
<script>
window.MathJax={tex:{inlineMath:[["\\(","\\)"]],displayMath:[["\\[","\\]"]],processEscapes:true},svg:{fontCache:"global"}};

<style>
@page{size:letter portrait;margin:.42in}
*{box-sizing:border-box}
:root{
 --ink:#111827;--navy:#173f6a;--muted:#4b5563;--rule:#4b5563;
 --grid:#5a6470;--axis:#101820;--point:#7f1d1d;
 --q1h:4.15in;--q2h:4.15in;--q3h:4.55in;--q4h:4.50in
}
html,body{margin:0;padding:0}
body{background:#e8edf1;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
.page{width:7.66in;height:10.16in;margin:16px auto;background:#fff;position:relative;page-break-after:always;overflow:hidden;padding:0 .04in}
.page:last-of-type{page-break-after:auto}
.student-row{display:grid;grid-template-columns:1fr 2.05in;gap:.28in;padding-top:.02in;margin:0 0 .08in;font-size:10.5pt}
.fill{display:inline-block;border-bottom:1.35px solid #30343a;min-width:3.55in;height:.17in;vertical-align:bottom}
.fill.date{min-width:1.40in}
.header{display:grid;grid-template-columns:1fr auto;gap:.18in;align-items:end;padding:.04in 0 .08in;border-bottom:1.75px solid var(--navy)}
.title{font-size:17pt;font-weight:800;line-height:1.06;color:var(--navy)}
.sub{font-size:9.2pt;margin-top:.035in;color:var(--muted)}
.version-label{font-size:9.2pt;font-weight:800;color:var(--navy);white-space:nowrap}
.directions{font-size:8.8pt;font-style:italic;color:var(--muted);margin:.07in 0 .06in}
.page2-top{height:.03in}
.page-body{min-height:0}
.question{position:relative;padding:.09in .02in .09in;display:flex;flex-direction:column;min-height:0;overflow:hidden}
.question + .question{border-top:1.8px solid var(--rule);margin-top:.03in;padding-top:.14in}
.qhead{display:flex;justify-content:space-between;gap:.18in;align-items:flex-start;margin-bottom:.055in;flex:none}
.qleft{display:flex;gap:.055in;align-items:baseline;min-width:0}
.qnumber{font-size:12pt;font-weight:800;color:var(--navy);flex:none}
.qtitle{font-size:12pt;font-weight:800;color:var(--navy);margin:0}
.ican{font-size:8.55pt;font-style:italic;color:var(--muted);text-align:right;max-width:3.55in;line-height:1.24}
.prompt{font-size:11.15pt;line-height:1.38;margin:.05in 0 .06in;flex:none}
.mini-direction{font-size:8.8pt;font-style:italic;color:var(--muted);margin:.015in 0 .025in;flex:none}
.workarea{flex:1;min-height:.45in;margin-top:.02in;background:none}
.workarea.small{min-height:.20in}
.source-q1{height:var(--q1h)} .source-q2{height:var(--q2h)} .source-q3{height:var(--q3h)} .source-q4{height:var(--q4h)}
.graph{display:block;margin:.045in auto 0;width:100%;height:0;flex:1 1 0;min-height:1.40in;max-height:2.80in}
.graph .grid{stroke:var(--grid);stroke-width:1.2}
.graph .axis{stroke:var(--axis);stroke-width:2.1}
.graph .tick{fill:#202833;font:9.5px Arial,Helvetica,sans-serif}
.graph .axis-label{fill:#111827;font:700 11px Arial,Helvetica,sans-serif}
.graph .axis-title{fill:#111827;font:700 10.5px Arial,Helvetica,sans-serif}
.graph .relation{stroke:var(--navy);stroke-width:3;fill:none}
.graph .point{fill:var(--point)}
.graph .point-label{fill:var(--point);font:700 11px Arial,Helvetica,sans-serif}
.coordinate-answer{font-size:10.8pt;margin:.045in 0 0;text-align:center;flex:none}
.interpret-box{display:grid;grid-template-columns:1fr 1fr;gap:.26in;font-size:9.6pt;line-height:1.28;margin-top:.04in;flex:none}
.interpret-box p{margin:0}
.footer{position:absolute;left:.04in;right:.04in;bottom:0;border-top:1.1px solid #737d89;padding-top:.05in;font-size:8.05pt;color:var(--muted);display:flex;justify-content:space-between}
.layout-controls{position:sticky;top:0;z-index:20;width:min(11.7in,calc(100% - 24px));margin:10px auto 4px;background:#fff;border:1px solid #aeb8c4;border-radius:10px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:10px 12px;font-size:12px}
.layout-controls .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.layout-controls h2{font-size:14px;margin:0;color:var(--navy)}
.layout-controls .hint{color:var(--muted);font-size:11px;line-height:1.25;max-width:5.7in}
.control-grid{display:grid;grid-template-columns:1.15fr repeat(4,minmax(160px,1fr));gap:8px}
.size-control,.split-control{border:1px solid #d5dbe2;border-radius:7px;padding:7px 8px}
.size-control label,.split-control label{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:#263445;margin-bottom:4px}
.size-control .inputs,.split-control .inputs{display:grid;grid-template-columns:1fr 60px;gap:6px;align-items:center}
.size-control input[type=range],.split-control input[type=range]{width:100%}
.size-control input[type=number],.split-control input[type=number]{width:60px;padding:4px;border:1px solid #aeb8c4;border-radius:5px;text-align:right;font:inherit}
.split-note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.25}
.fit-summary{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:10px;max-width:350px}
.fit-chip{padding:3px 5px;border-radius:999px;border:1px solid #cbd5df;background:#f8fafc}
.fit-ok{color:#137a4b;border-color:#9bd6bd;background:#f0fbf6} .fit-warn{color:#b42318;border-color:#efb1ab;background:#fff5f4}
.control-buttons{display:flex;gap:6px}
.control-buttons button{border:1px solid #8da0b3;background:#fff;color:var(--navy);font-weight:700;border-radius:6px;padding:6px 9px;cursor:pointer}
.control-buttons button.print{background:var(--navy);color:#fff;border-color:var(--navy)}
.screen-version-note{width:7.66in;margin:12px auto -6px;font-weight:800;color:var(--navy);font-size:12px}
@media(max-width:1050px){.control-grid{grid-template-columns:1fr 1fr}.layout-controls{position:relative}}
@media print{
 .layout-controls,.screen-version-note{display:none!important}
 body{background:#fff}
 .page{margin:0}
}
</style>
</head>

d" x1="62" x2="402" y1="190.0" y2="190.0"/><line class="grid" x1="118.7" x2="118.7" y1="20" y2="190"/><line class="grid" x1="62" x2="402" y1="161.7" y2="161.7"/><line class="grid" x1="175.3" x2="175.3" y1="20" y2="190"/><line class="grid" x1="62" x2="402" y1="133.3" y2="133.3"/><line class="grid" x1="232.0" x2="232.0" y1="20" y2="190"/><line class="grid" x1="62" x2="402" y1="105.0" y2="105.0"/><line class="grid" x1="288.7" x2="288.7" y1="20" y2="190"/><line class="grid" x1="62" x2="402" y1="76.7" y2="76.7"/><line class="grid" x1="345.3" x2="345.3" y1="20" y2="190"/><line class="grid" x1="62" x2="402" y1="48.3" y2="48.3"/><line class="grid" x1="402.0" x2="402.0" y1="20" y2="190"/><line class="grid" x1="62" x2="402" y1="20.0" y2="20.0"/><line class="axis" x1="62" x2="402" y1="190" y2="190"/><line class="axis" x1="62" x2="62" y1="20" y2="190"/><text class="tick" text-anchor="middle" x="62.0" y="206">0</text><text class="tick" text-anchor="end" x="55" y="193.5">0</text><text class="tick" text-anchor="middle" x="118.7" y="206">6</text><text class="tick" text-anchor="end" x="55" y="165.2">30</text><text class="tick" text-anchor="middle" x="175.3" y="206">12</text><text class="tick" text-anchor="end" x="55" y="136.8">60</text><text class="tick" text-anchor="middle" x="232.0" y="206">18</text><text class="tick" text-anchor="end" x="55" y="108.5">90</text><text class="tick" text-anchor="middle" x="288.7" y="206">24</text><text class="tick" text-anchor="end" x="55" y="80.2">120</text><text class="tick" text-anchor="middle" x="345.3" y="206">30</text><text class="tick" text-anchor="end" x="55" y="51.8">150</text><text class="tick" text-anchor="middle" x="402.0" y="206">36</text><text class="tick" text-anchor="end" x="55" y="23.5">180</text><line class="relation" x1="62.0" y1="20.0" x2="402.0" y2="190.0"/><circle class="point" cx="62.0" cy="20.0" r="4.8"/><circle class="point" cx="402.0" cy="190.0" r="4.8"/><text class="axis-title" text-anchor="middle" x="232.0" y="231">Time (minutes)</text><text class="axis-title" text-anchor="middle" transform="translate(14,105.0) rotate(-90)">Water remaining (gallons)</text></svg><div class="interpret-box"><p><strong>y-intercept:</strong> What does it tell you about the tank?</p><p><strong>x-intercept:</strong> What does it tell you about the tank?</p></div><div class="workarea small"></div></section></template>

<script>
(()=>{
 const defaults={1:4.15,2:4.15,3:4.55,4:4.50};
 const orders={"A":[1,3,2,4],"B":[4,1,3,2],"C":[2,4,1,3],"D":[3,2,4,1]};
 const root=document.documentElement;
 const pagesRoot=document.getElementById('pagesRoot');
 const keyPrefix='qc_1_2_20260913';
 window.__QC_READY=false;
 function pageShell(version,pageNo){
  const page=document.createElement('section');
  page.className='page';page.dataset.version=version;page.dataset.page=String(pageNo);
  if(pageNo===1){
   page.innerHTML=`<div class="student-row"><div><strong>Name:</strong> <span class="fill"></span></div><div><strong>Date:</strong> <span class="fill date"></span></div></div>
   <div class="header"><div><div class="title">Quick Check 1.2</div><div class="sub">Algebra 1 - Inputs, Outputs, and Functions</div></div><div class="version-label">Version ${version}</div></div>
   <p class="directions">Show enough work to make your thinking clear. Write each answer in the space provided.</p><div class="page-body"></div>`;
  } else {page.innerHTML='<div class="page2-top"></div><div class="page-body"></div>';}
  const footer=document.createElement('div');footer.className='footer';footer.innerHTML=`<span>Algebra 1 - Quick Check 1.2 - Version ${version}</span><span>Page ${pageNo} of 2</span>`;page.appendChild(footer);
  return page;
 }
 function cloneQuestion(version,sourceQ){return document.getElementById(`tpl-${version}-${sourceQ}`).content.firstElementChild.cloneNode(true);}
 async function buildPages(split){
  pagesRoot.innerHTML='';
  Object.keys(orders).forEach(version=>{
   const p1=pageShell(version,1),p2=pageShell(version,2);
   orders[version].forEach((sourceQ,idx)=>{
    const q=cloneQuestion(version,sourceQ);q.querySelector('.qnumber').textContent=`${idx+1}.`;(idx<split?p1:p2).querySelector('.page-body').appendChild(q);
   });
   pagesRoot.appendChild(p1);pagesRoot.appendChild(p2);
  });
  if(window.MathJax?.typesetPromise){
   try{MathJax.typesetClear?.([pagesRoot]);await MathJax.typesetPromise([pagesRoot]);}catch(e){console.error(e);}
  }
  requestAnimationFrame(()=>{updateFit();window.__QC_READY=true;});
 }
 function setSize(q,val,save=true){
  val=Math.max(2.2,Math.min(7.8,Number(val)||defaults[q]));root.style.setProperty(`--q${q}h`,`${val.toFixed(2)}in`);
  const box=document.querySelector(`.size-control[data-q="${q}"]`);box.querySelector('input[type=range]').value=val.toFixed(2);box.querySelector('input[type=number]').value=val.toFixed(2);box.querySelector('output').value=val.toFixed(2);
  if(save)localStorage.setItem(`${keyPrefix}_q${q}_height`,val.toFixed(2));requestAnimationFrame(updateFit);
 }
 function setSplit(val,save=true){
  const n=Math.max(1,Math.min(3,parseInt(val,10)||2));document.getElementById('pageSplitRange').value=n;document.getElementById('pageSplitNumber').value=n;document.getElementById('splitOutput').value=n;
  document.getElementById('splitNote').textContent=`Page 1: ${n} problem${n===1?'':'s'} - Page 2: ${4-n} problem${4-n===1?'':'s'}`;
  if(save)localStorage.setItem(`${keyPrefix}_split`,String(n));window.__QC_READY=false;buildPages(n);
 }
 function pageFreeInches(page){
  const footer=page.querySelector('.footer');const body=page.querySelector('.page-body');const items=[...body.querySelectorAll('.question')];const target=items.length?items[items.length-1]:body;
  const free=(footer.getBoundingClientRect().top-target.getBoundingClientRect().bottom)/96;
  let internal=0;items.forEach(q=>{internal=Math.max(internal,(q.scrollHeight-q.clientHeight)/96);});
  return internal>0.01?-internal:free;
 }
 function updateFit(){
  const box=document.getElementById('fitSummary');if(!box)return;box.innerHTML='';document.querySelectorAll('.page').forEach(page=>{const free=pageFreeInches(page);const chip=document.createElement('span');chip.className='fit-chip '+(free>=0?'fit-ok':'fit-warn');chip.textContent=`${page.dataset.version}${page.dataset.page}: ${free>=0?free.toFixed(2)+' free':Math.abs(free).toFixed(2)+' over'}`;box.appendChild(chip);});
 }
 document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.size-control').forEach(box=>{const q=box.dataset.q;const range=box.querySelector('input[type=range]');const num=box.querySelector('input[type=number]');range.addEventListener('input',()=>setSize(q,range.value));num.addEventListener('input',()=>setSize(q,num.value));const saved=localStorage.getItem(`${keyPrefix}_q${q}_height`);setSize(q,saved??defaults[q],false);});
  document.getElementById('pageSplitRange').addEventListener('input',e=>setSplit(e.target.value));document.getElementById('pageSplitNumber').addEventListener('input',e=>setSplit(e.target.value));
  document.getElementById('resetSizes').addEventListener('click',()=>{Object.entries(defaults).forEach(([q,v])=>{localStorage.removeItem(`${keyPrefix}_q${q}_height`);setSize(q,v,false);});localStorage.removeItem(`${keyPrefix}_split`);setSplit(2,false);});
  document.getElementById('printNow').addEventListener('click',()=>window.print());window.addEventListener('resize',updateFit);
  const savedSplit=localStorage.getItem(`${keyPrefix}_split`)||'2';setSplit(savedSplit,false);
 });
})();
</script>

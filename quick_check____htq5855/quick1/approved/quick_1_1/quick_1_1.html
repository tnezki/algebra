<style>
@page{size:letter portrait;margin:.42in}
*{box-sizing:border-box}
:root{--q1h:4.38in;--q2h:4.38in;--q3h:4.38in;--q4h:4.38in;--q1g:49%;--q2g:47%;--q3g:52%;--q4g:52%;--q1w:.12in;--q2w:.16in;--q3w:.20in;--q4w:.22in}
:root{--ink:#111827;--navy:#173f6a;--muted:#4b5563;--rule:#59636f;--panel:#f8fafc}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#e9edf1}
.app-shell{display:grid;grid-template-columns:310px minmax(0,1fr);align-items:start;gap:18px}
.layout-controls{position:sticky;top:0;height:100vh;overflow:auto;background:#fff;border-right:1px solid #b8c1cb;padding:16px 14px;box-shadow:3px 0 14px rgba(0,0,0,.08);z-index:20}
.control-title{font-size:17px;font-weight:800;color:var(--navy);margin-bottom:2px}
.layout-version{font-size:11px;font-weight:800;color:#576579;margin-bottom:9px}
.control-hint{font-size:11px;line-height:1.35;color:var(--muted);margin:0 0 12px}
.split-control,.source-control{border:1px solid #d5dbe2;border-radius:8px;padding:9px;margin-bottom:9px;background:#fff}
.split-control label,.source-control .source-name{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;font-weight:800;color:#263445;margin-bottom:6px}
.pair{display:grid;grid-template-columns:1fr 64px;gap:7px;align-items:center}
.pair input[type=range]{width:100%}
.pair input[type=number]{width:64px;padding:4px;border:1px solid #aeb8c4;border-radius:5px;text-align:right;font:inherit}
.mini-label{font-size:10px;color:var(--muted);margin-top:6px;margin-bottom:2px;display:flex;justify-content:space-between}
.tiny{font-size:10px;color:var(--muted);margin-top:5px}
.control-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;color:#66758a;margin:13px 1px 6px}
.fit-summary{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
.fit-chip{padding:4px 6px;border-radius:999px;border:1px solid #cbd5df;background:#f8fafc;font-size:10px;text-align:center}
.fit-ok{color:#137a4b;border-color:#9bd6bd;background:#f0fbf6}.fit-warn{color:#b42318;border-color:#efb1ab;background:#fff5f4}
.control-buttons{display:grid;grid-template-columns:1fr 1.35fr;gap:7px;margin-top:12px;position:sticky;bottom:0;background:#fff;padding:8px 0 2px}
.control-buttons button{border:1px solid #8da0b3;background:#fff;color:var(--navy);font-weight:800;border-radius:6px;padding:8px 7px;cursor:pointer}
.control-buttons .print{background:var(--navy);color:#fff;border-color:var(--navy)}
.preview-root{padding:2px 16px 28px 0;min-width:0}
.screen-version-note{width:7.66in;max-width:calc(100vw - 360px);margin:10px auto -6px;font-weight:800;color:var(--navy);font-size:12px}
.page{width:7.66in;height:10.16in;margin:16px auto;background:#fff;position:relative;break-after:page;page-break-after:always;overflow:hidden;padding:0 .04in;box-shadow:0 2px 13px rgba(0,0,0,.16)}
.page:last-child{break-after:auto;page-break-after:auto}
.student-row{display:grid;grid-template-columns:1fr 2.0in;gap:.28in;padding-top:.02in;margin:0 0 .08in;font-size:10.5pt}
.fill{display:inline-block;border-bottom:1.3px solid #30343a;min-width:3.55in;height:.17in;vertical-align:bottom}.fill.date{min-width:1.38in}
.header{display:grid;grid-template-columns:1fr auto;gap:.2in;align-items:end;padding:.04in 0 .08in;border-bottom:1.7px solid var(--navy)}
.title{font-size:17pt;font-weight:800;line-height:1.05;color:var(--navy)}.sub{font-size:9.3pt;margin-top:.035in;color:var(--muted)}.version-label{font-size:9pt;font-weight:800;color:var(--navy);white-space:nowrap}
.directions{font-size:8.8pt;font-style:italic;color:var(--muted);margin:.07in 0 .08in}.page2-top{height:.02in}.page-body{min-height:0}
.question{position:relative;padding:.10in .02in .10in;display:flex;flex-direction:column;min-height:0;overflow:visible}
.question + .question{border-top:1.55px solid var(--rule);margin-top:.02in;padding-top:.14in}
.source-q1{height:var(--q1h)}.source-q2{height:var(--q2h)}.source-q3{height:var(--q3h)}.source-q4{height:var(--q4h)}
.qhead{display:flex;justify-content:space-between;gap:.18in;align-items:flex-start;margin-bottom:.04in;flex:none}.qleft{display:flex;gap:.05in;align-items:baseline;min-width:0}
.qnumber{font-size:12pt;font-weight:800;color:var(--navy);flex:none}.qtitle{font-size:12pt;font-weight:800;color:var(--navy);margin:0}.ican{font-size:8.55pt;font-style:italic;color:var(--muted);text-align:right;max-width:3.5in;line-height:1.23}
.prompt{font-size:11.2pt;line-height:1.35;margin:.04in 0 .04in;flex:none}
.graph-img{display:block;object-fit:contain;height:auto;max-height:2.43in;margin:.035in auto .02in;flex:none}
.source-q1 .graph-img{width:var(--q1g)}.source-q2 .graph-img{width:var(--q2g)}.source-q3 .graph-img{width:var(--q3g)}.source-q4 .graph-img{width:var(--q4g)}
.workarea{flex:none;background:none;margin-top:.02in}.source-q1 .workarea{height:var(--q1w)}.source-q2 .workarea{height:var(--q2w)}.source-q3 .workarea{height:var(--q3w)}.source-q4 .workarea{height:var(--q4w)}
.axis-answer{display:flex;justify-content:space-between;gap:.25in;font-size:9.5pt;margin:.02in 0 .01in}.answer-line{font-size:10.6pt;text-align:center;margin:.03in 0 0}.answers{display:flex;justify-content:space-between;gap:.35in;font-size:10.4pt;margin-top:.045in}
.footer{position:absolute;left:.04in;right:.04in;bottom:0;border-top:1.1px solid #7d8794;padding-top:.045in;font-size:8.1pt;color:var(--muted);display:flex;justify-content:space-between;background:#fff}
#templates{display:none}
@media(max-width:1120px){.app-shell{grid-template-columns:1fr}.layout-controls{position:relative;height:auto;border-right:none;border-bottom:1px solid #b8c1cb}.preview-root{padding-right:0}.screen-version-note{max-width:95vw}}
@media print{.layout-controls,.screen-version-note,#templates{display:none!important}body{background:#fff}.app-shell{display:block}.preview-root{padding:0}.page{margin:0;box-shadow:none}}
</style>

    `<div class="mini-label"><span>Overall height</span><span><output>${defaults.height[q].toFixed(2)}</output> in</span></div><div class="pair" data-kind="height"><input type="range" min="2" max="7.6" step=".05"><input type="number" min="2" max="7.6" step=".05"></div>`+
    `<div class="mini-label"><span>Graph width</span><span><output>${defaults.graph[q]}</output>%</span></div><div class="pair" data-kind="graph"><input type="range" min="28" max="78" step="1"><input type="number" min="28" max="78" step="1"></div>`+
    `<div class="mini-label"><span>Workspace height</span><span><output>${defaults.work[q].toFixed(2)}</output> in</span></div><div class="pair" data-kind="work"><input type="range" min="0" max="1.5" step=".05"><input type="number" min="0" max="1.5" step=".05"></div>`;host.appendChild(box);
    ['height','graph','work'].forEach(kind=>{const row=box.querySelector(`[data-kind="${kind}"]`);const r=row.querySelector('input[type=range]'),n=row.querySelector('input[type=number]');const saved=localStorage.getItem(`qc11_${kind}_${q}`);const dv=defaults[kind][q];setVar(kind,q,saved??dv,false);r.addEventListener('input',()=>setVar(kind,q,r.value));n.addEventListener('input',()=>setVar(kind,q,n.value));});
  });
}
function setSplit(v,save=true){v=Math.max(1,Math.min(3,parseInt(v,10)||2));document.getElementById('pageSplitRange').value=v;document.getElementById('pageSplitNumber').value=v;document.getElementById('splitOutput').value=v;document.getElementById('splitNote').textContent=`Page 1: ${v} · Page 2: ${4-v}`;if(save)localStorage.setItem('qc11_split',v);buildPages(v)}
function pageFree(page){const footer=page.querySelector('.footer');const qs=[...page.querySelectorAll('.question')];const last=qs.at(-1);if(!last)return 9;let free=(footer.getBoundingClientRect().top-last.getBoundingClientRect().bottom)/96;for(const q of qs){const over=(q.scrollHeight-q.clientHeight)/96;if(over>.01)free=Math.min(free,-over)}return free}
function updateFit(){const host=document.getElementById('fitSummary');host.innerHTML='';document.querySelectorAll('.page').forEach(p=>{const f=pageFree(p);const chip=document.createElement('span');chip.className='fit-chip '+(f>=-.01?'fit-ok':'fit-warn');chip.textContent=`${p.dataset.version}${p.dataset.page}: ${f>=0?f.toFixed(2)+' free':Math.abs(f).toFixed(2)+' over'}`;host.appendChild(chip)})}
makeControls();document.getElementById('pageSplitRange').addEventListener('input',e=>setSplit(e.target.value));document.getElementById('pageSplitNumber').addEventListener('input',e=>setSplit(e.target.value));setSplit(localStorage.getItem('qc11_split')||defaults.split,false);
document.getElementById('resetLayout').addEventListener('click',()=>{[1,2,3,4].forEach(q=>['height','graph','work'].forEach(kind=>{localStorage.removeItem(`qc11_${kind}_${q}`);setVar(kind,q,defaults[kind][q],false)}));localStorage.removeItem('qc11_split');setSplit(defaults.split,false)});
document.getElementById('printNow').addEventListener('click',()=>window.print());window.addEventListener('resize',updateFit);window.addEventListener('load',()=>setTimeout(updateFit,350));
})();
</script>
</body></html>

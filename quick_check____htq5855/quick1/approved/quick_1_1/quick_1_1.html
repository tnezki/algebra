(() => {
  const root=document.documentElement;
  const pagesRoot=document.getElementById('pagesRoot');
  const VERSION_ORDER={A:[1,2,3,4],B:[3,1,4,2],C:[2,4,1,3],D:[4,3,2,1]};
  const defaults={1:4.25,2:4.35,3:4.45,4:4.35};
  function cloneQuestion(version,sourceQ){const tpl=document.getElementById(`tpl-${version}-${sourceQ}`);return tpl.content.firstElementChild.cloneNode(true)}
  function buildPages(split){
    pagesRoot.innerHTML='';
    ['A','B','C','D'].forEach(version=>{
      const order=VERSION_ORDER[version];
      const note=document.createElement('div');note.className='screen-version-note';note.textContent=`Preview - Version ${version} - printed order ${order.join(' -> ')}`;pagesRoot.appendChild(note);
      const p1=document.createElement('section');p1.className='page page1';p1.dataset.version=version;p1.dataset.page='1';
      p1.innerHTML=`<div class="student-row"><div>Name: <span class="fill"></span></div><div>Date: <span class="fill date"></span></div></div><div class="header"><div><div class="title">Quick Check 1.1</div><div class="sub">Multiple Representations of Relationships &middot; Algebra 1 &middot; Unit 1</div></div><div class="version-label">VERSION ${version}</div></div><div class="directions">Show enough work to make your thinking clear.</div><div class="page-body"></div><div class="footer"><span>Quick Check 1.1</span><span>Version ${version} &middot; Page 1 of 2</span></div>`;
      const p2=document.createElement('section');p2.className='page page2';p2.dataset.version=version;p2.dataset.page='2';
      p2.innerHTML=`<div class="page2-top"></div><div class="page-body"></div><div class="footer"><span>Quick Check 1.1</span><span>Version ${version} &middot; Page 2 of 2</span></div>`;
      order.forEach((sourceQ,idx)=>{const q=cloneQuestion(version,sourceQ);q.querySelector('.qnumber').textContent=`${idx+1}.`; (idx<split?p1:p2).querySelector('.page-body').appendChild(q)});
      pagesRoot.appendChild(p1);pagesRoot.appendChild(p2);
    });
    if(window.MathJax?.typesetPromise){MathJax.typesetClear?.([pagesRoot]);MathJax.typesetPromise([pagesRoot]).then(()=>setTimeout(updateFit,40));} else {requestAnimationFrame(updateFit)}
  }
  function setSize(q,val,save=true){val=Math.max(1.8,Math.min(7.8,Number(val)||defaults[q]));root.style.setProperty(`--q${q}h`,`${val.toFixed(2)}in`);const box=document.querySelector(`.size-control[data-q="${q}"]`);box.querySelector('input[type=range]').value=val.toFixed(2);box.querySelector('input[type=number]').value=val.toFixed(2);box.querySelector('output').value=val.toFixed(2);if(save)localStorage.setItem(`qc11_ad_q${q}_height`,val.toFixed(2));requestAnimationFrame(updateFit)}
  function setSplit(val,save=true){const n=Math.max(1,Math.min(3,parseInt(val,10)||2));document.getElementById('pageSplitRange').value=n;document.getElementById('pageSplitNumber').value=n;document.getElementById('splitOutput').value=n;document.getElementById('splitNote').textContent=`Page 1: ${n} problem${n===1?'':'s'} - Page 2: ${4-n} problem${4-n===1?'':'s'}`;if(save)localStorage.setItem('qc11_ad_split',String(n));buildPages(n)}
  function pageFreeInches(page){const footer=page.querySelector('.footer');const body=page.querySelector('.page-body');const items=[...body.querySelectorAll('.question')];const target=items.length?items[items.length-1]:body;return(footer.getBoundingClientRect().top-target.getBoundingClientRect().bottom)/96}
  function updateFit(){const box=document.getElementById('fitSummary');box.innerHTML='';document.querySelectorAll('.page').forEach(page=>{const free=pageFreeInches(page);const chip=document.createElement('span');chip.className='fit-chip '+(free>=0?'fit-ok':'fit-warn');chip.textContent=`${page.dataset.version}${page.dataset.page}: ${free>=0?free.toFixed(2)+' free':Math.abs(free).toFixed(2)+' over'}`;box.appendChild(chip)})}
  document.querySelectorAll('.size-control').forEach(box=>{const q=box.dataset.q;const range=box.querySelector('input[type=range]');const num=box.querySelector('input[type=number]');range.addEventListener('input',()=>setSize(q,range.value));num.addEventListener('input',()=>setSize(q,num.value));const saved=localStorage.getItem(`qc11_ad_q${q}_height`);setSize(q,saved??defaults[q],false)});

})();

<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
body{font-family:Arial,sans-serif;margin:16px;}
.controls{display:flex;gap:8px;align-items:center;margin-bottom:10px;}

<div class="controls"><label>Title <input id="title" value="Unit 3.5 — Tarsia"/></label><button onclick="render()">Generate</button><button onclick="shuffleCards()">Shuffle</button><button onclick="print()">Print</button></div>
<textarea id="csv"></textarea>
<div id="cards" class="grid"></div>
<script>
const DEFAULT_CSV = `"<p>What is the first check you can do to decide if $(2,5)$ is feasible for a system?</p>","<p>First substitute $(2,5)$ into each inequality in the system. The point is feasible only if it makes every inequality true.</p>"
"<p>Use two points on each boundary to write the boundary equations, then use the shaded overlap to write the system of inequalities represented by the graph.</p> <div class=""ps-figure wu-img-350""> <img alt=""graph of a feasible region"" src=""figures/u3_bank_s5_system_region2_sq_v1.png""/> </div>","<p>The boundaries are $y=2x+3$ with shading below and a dashed line, and $y=-x-1$ with shading above and a solid line. The system is $y\lt2x+3$ and $y\ge -x-1$.</p>"
"<p>Construct a strategy for graphing a system with constraints $x\ge 0$, $y\ge 0$, $x+y\le 12$, and $y\ge x-2$.</p> <p>Your strategy must explain the order you would graph boundaries, how you would handle the nonnegative constraints, and how you would identify the final feasible region.</p>",<p>Graph $x=0$ and $y=0$ first to restrict the region to the first quadrant. Then graph $x+y=12$ as a solid line and shade below it. Graph $y=x-2$ as a solid line and shade above it. The feasible region is the overlap of all four shaded regions.</p>
"<p>A student council has \$200 for prizes. Small prizes cost \$8 and large prizes cost \$15. They want at least 18 total prizes. Let $s$ be small prizes and $l$ be large prizes.</p> <ol class=""lower-alpha""><li>Write a system of inequalities for the constraints.</li><li>Recommend either $(10,8)$ or $(14,5)$ as the better feasible order, or explain if neither works.</li><li>Justify your recommendation using both total prizes and total cost.</li></ol>","<p>The constraints are $8s+15l\le200$, $s+l\ge18$, $s\ge0$, and $l\ge0$. For $(10,8)$: prizes $18$ and cost $80+120=200$, so it is feasible. For $(14,5)$: prizes $19$ and cost $112+75=187$, so it is feasible. $(14,5)$ is better if saving money matters because it meets the prize minimum at lower cost.</p>"
<p>Evaluate $2x+5$ when $x=6$.</p>,<p>$2(6)+5=17$.</p>
<p>Use the distributive property to rewrite $3(x+2)$.</p>,<p>$3(x+2)=3x+6$.</p>
<p>Factor the common factor from $6x+9$.</p>,<p>$6x+9=3(2x+3)$.</p>
<p>A gym membership costs \$25 to join and \$15 each month. Write an equation and use it to find the cost after $6$ months.</p>,"<p>Let $m$ be months. $C=25+15m$. For $6$ months, $C=25+15(6)=115$, so the cost is \$115.</p>"
"<p>Decide whether the table and equation represent the same relationship. Use at least two values as evidence.</p> <p>Equation: $y=4x-1$</p> <table class=""values""> <tr><th>$x$</th><th>0</th><th>1</th><th>2</th><th>3</th></tr> <tr><td>$y$</td><td>-1</td><td>3</td><td>7</td><td>11</td></tr> </table>","<p>Check $y=4x-1$. For $x=0$, $y=-1$; for $x=1$, $y=3$; for $x=2$, $y=7$. These match the table, so the representations match.</p>"
"<p>The graph shows a cost relationship. Use the graph to estimate the cost for $8$ tickets and explain how you used the axes.</p> <div class=""ps-figure wu-img-350""> <img alt=""Context graph of total cost by number of tickets."" src=""figures/u1_bank_s1_context_cost_sq_v1.png""/> </div>","<p>The graph follows $y=5+4x$. At $x=8$, $y=5+4(8)=37$, so the cost is about \$37.</p>"
<p>Analyze the structure of $4(x+3)+2(x+3)$. Rewrite it in two equivalent ways and explain which form makes the repeated group easiest to see.</p>,<p>Combine common groups: $4(x+3)+2(x+3)=(4+2)(x+3)=6(x+3)$. Expanded form is $6x+18$. The factored form $6(x+3)$ makes the repeated group easiest to see.</p>
"<p>A table for an input-output rule is flawed: $(0,3),(1,6),(2,9),(2,12),(3,12)$. Revise the relation in two different ways: one revision that makes it a function with a constant increase, and one revision that makes it a function but not a constant-increase rule. Explain both choices.</p>","<p>Constant-increase revision: $(0,3),(1,6),(2,9),(3,12)$. Function but not constant-increase revision: $(0,3),(1,6),(2,9),(3,15). The first has one output per input and constant differences; the second has one output per input but nonconstant differences.</p>"
<p>State why $x=5$ cannot be written as $y=mx+b$.</p>,<p>$x=5$ is vertical and gives one $x$ value with many possible $y$ values. It cannot be written as $y=mx+b$ because it is not a function of $x$.</p>
"<p>Write the equation of the line through $(4,7)$ and $(8,15)$. Show how you found the intercept.</p>","<p>Slope is $\frac{15-7}{8-4}=\frac{8}{4}=2$. Use $y=2x+b$ and point $(4,7)$: $7=8+b$, so $b=-1$. Equation: $y=2x-1$.</p>"
"<p>Compare the scatter plot with the table. Decide whether one linear model could reasonably represent both and justify with trend and rate evidence.</p> <div class=""ps-figure wu-img-350""><img alt=""scatter plot with a positive association"" src=""figures/u2_bank_s5_scatter_cost_sq_v1.png""/></div> <table class=""values""> <tr><th>$x$</th><th>2</th><th>4</th><th>6</th><th>8</th></tr> <tr><td>$y$</td><td>16</td><td>27</td><td>39</td><td>50</td></tr> </table>","<p>The table has rates about $\frac{11}{2}=5.5$, $\frac{12}{2}=6$, and $\frac{11}{2}=5.5$, a roughly linear trend. The scatter plot also trends upward, but later points rise faster. One linear model could be reasonable as an approximation for the early/middle data, but the scatter suggests the rate may increase at higher $x$ values.</p>"
"<p>Synthesize one relationship in four ways: equation, table, graphing points, and context. The slope must be $-2$ and the relationship must contain $(0,12)$.</p>","<p>Equation: $y=-2x+12$. Table: $(0,12),(1,10),(2,8),(3,6). Graphing points are the same coordinate pairs plotted and connected. Context: a tank starts with $12$ gallons and drains $2$ gallons per minute.</p>"
<p>Describe the overlap for $y\le 4$ and $x&gt;1$.</p>,<p>The overlap is all points at or below the horizontal line $y=4$ and to the right of the dashed vertical line $x=1$.</p>
<p>Why can a system of inequalities have infinitely many solution points?</p>,"<p>A system of inequalities can have infinitely many solutions because shaded regions usually cover areas, not just one point.</p>"
`;
document.getElementById('csv').value = DEFAULT_CSV;
function parseCSV(text){
  const rows=[]; let row=[], cur='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i], n=text[i+1];
    if(c==='"' && q && n==='"'){cur+='"'; i++;}
    else if(c==='"') q=!q;
    else if(c===',' && !q){row.push(cur); cur='';}
    else if((c==='
'||c==='') && !q){ if(cur!==''||row.length){row.push(cur); rows.push(row);} row=[]; cur=''; if(c===''&&n==='
') i++; }
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur); rows.push(row);}
  return rows.filter(r=>r.length>=2);
}
let data=[];
function render(){
 data=parseCSV(document.getElementById('csv').value);
 const cards=document.getElementById('cards'); cards.innerHTML='';
 data.forEach((r,i)=>{
   const q=document.createElement('div'); q.className='card'; q.innerHTML='<b>Q '+(i+1)+'</b>'+r[0]; cards.appendChild(q);
   const a=document.createElement('div'); a.className='card'; a.innerHTML='<b>A '+(i+1)+'</b>'+r[1]; cards.appendChild(a);
 });
 if(window.MathJax) MathJax.typesetPromise();
}
function shuffleCards(){
 const cards=[...document.querySelectorAll('.card')];
 for(let i=cards.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); cards[i].parentNode.insertBefore(cards[j],cards[i]); }
}
render();
</script></body></html>

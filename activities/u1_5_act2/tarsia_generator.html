<h1 id="shownTitle">Unit 1.5 — Tarsia</h1><div id="out"></div>
<script>
const DEFAULT_CSV = `"In the equation $C=15+3m$, what could $m$ represent if $C$ is cost?","$m$ could represent the number of miles, months, minutes, or other units being charged at $\\$3$ each. The $15$ is the starting cost."
"The graph shows two cost models. Estimate the value of $x$ where the costs are equal, then write the equation that the intersection represents. | [Figure: Graph of two linear cost models with an intersection.]","The costs are equal at about $x=5$, with cost about $25$. The intersection represents $15+2x=5+4x$."
Construct a strategy for translating a context into an equation before solving. Apply your strategy to: a phone plan charges \\$12 plus \\$5 per gigabyte and the total bill is \\$47.,"Define the variable first: let $g$ be gigabytes. Translate the fixed charge and rate: $12+5g=47$. Solve: $5g=35$, so $g=7$. The bill includes $7$ gigabytes."
"Design a one-variable equation model for a realistic school or club situation where the solution is $8$. Include the context, define the variable, write the equation, solve it, and interpret why $8$ makes sense.","One valid model: A club has $4$ posters and prints $2$ posters per student helper. If the total is $20$, then $2x+4=20$. Solving gives $2x=16$, so $x=8$. The solution means $8$ helpers are needed."
Solve $5-(2x-3)=-8+2x$. Show the distribution of the negative sign.,"Distribute the negative sign: $5-(2x-3)=5-2x+3=8-2x$. Then $8-2x=-8+2x$, so $16=4x$ and $x=4$."
"First simplify both sides of $10-2(2x+1)=4(x-2)$, then solve the resulting linear equation.","Left side: $10-2(2x+1)=10-4x-2=8-4x$. Right side: $4(x-2)=4x-8$. Solve $8-4x=4x-8$, so $16=8x$ and $x=2$."
"Identify the first operation you would undo in $\\frac{x-4}{3}=7$, then solve.","Undo division by $3$ first: multiply both sides by $3$ to get $x-4=21$. Then add $4$, so $x=25$."
A student says $-2\\frac{1}{3}+5\\frac{1}{6}=3\\frac{2}{3}$. Recompute the sum and identify the step where the likely error occurred.,$-2\\frac{1}{3}+5\\frac{1}{6}=-\\frac{14}{6}+\\frac{31}{6}=\\frac{17}{6}=2\\frac{5}{6}$. The likely error was combining fractional parts without correct common denominators.
Start at $-2.5$ on the number line. Move right $3.75$ units and then left $1.25$ units. Mark the pathway and state the final location. | [Figure: Blank number line from negative ten to ten for modeling signed moves],Start at $-2.5$. Right $3.75$ gives $1.25$. Left $1.25$ gives $0$. The final location is $0$.
Complete the diamond problem. The top is the product and the bottom is the sum. Explain which operation you used first. | [Figure: Diamond problem with product negative twenty four and sum two],The two numbers are $6$ and $-4$ because $6(-4)=-24$ and $6+(-4)=2$.
"A student solves $3x+5=20$ by subtracting $3$ first and then dividing by $5$, giving $x=\\frac{17}{5}$. Critique the pathway and solve correctly.","Subtracting $3$ first is incorrect because $3x$ is a term, not a number being added. Correct: $3x+5=20$, subtract $5$ to get $3x=15$, then divide by $3$ to get $x=5$."
"A lab report states: ""The sample changed by $-1.2$, then by $-\\frac{3}{5}$, so the total change is $-1.7$ because $\\frac{3}{5}=0.5$."" Revise the model and write the corrected total change with units.","$\\frac{3}{5}=0.6$, so the corrected total change is $-1.2-0.6=-1.8$ units. The report should revise $0.5$ to $0.6$."
"In the equation $y={5}x+2$, identify the rate of change.",The rate of change is $5$.
A pattern doubles the input and then adds ${3}$. Another pattern adds ${3}$ and then doubles. Compare the outputs when the input is ${5}$.,Double then add $3$: $2(5)+3=13$. Add $3$ then double: $2(5+3)=16$. The outputs are different because the operations happen in a different order.
A student says Plan A is always better because it starts higher. Plan A is $A(x)=x+20$ and Plan B is $B(x)={5}x+4$. Decide whether the claim is reasonable and justify your conclusion.,"The claim is not always reasonable. Compare $A(x)=x+20$ and $B(x)=5x+4$. They are equal when $x+20=5x+4$, so $16=4x$ and $x=4$. Plan A is better for $x\\lt4$, they tie at $4$, and Plan B is better after that."
"Two clubs offer reward plans. Plan A has a larger starting bonus; Plan B earns points faster. Recommend a plan for a student who will participate for ${3}$ weeks and for a student who will participate for ${12}$ weeks. Create or choose equations, then justify using at least two representations.","One valid comparison: Plan A $A(w)=20+2w$ and Plan B $B(w)=5+5w$. For $3$ weeks, $A(3)=26$ and $B(3)=20$, so choose A. For $12$ weeks, $A(12)=44$ and $B(12)=65$, so choose B. The equations and table values show the larger start versus faster rate."
A taxi charges $5+2m$ dollars. Write an equation if the total is $21$.,$5+2m=21$.
Solve $4x-3=13$.,"$4x-3=13$ gives $4x=16$, so $x=4$."`;
document.getElementById('csv').value = DEFAULT_CSV;
function parseCSV(text){
  const rows=[]; let row=[], field='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"' && text[i+1]==='"'){field+='"';i++;} else if(c==='"'){q=false;} else field+=c; }
    else { if(c==='"') q=true; else if(c===','){row.push(field.trim()); field='';} else if(c==='
'){row.push(field.trim()); if(row.length>1) rows.push(row); row=[]; field='';} else if(c==='
'){} else field+=c; }
  }
  row.push(field.trim()); if(row.length>1 && row.some(x=>x)) rows.push(row); return rows;
}
function generate(){
  document.getElementById('shownTitle').textContent=document.getElementById('title').value;
  const rows=parseCSV(document.getElementById('csv').value);
  let html='<table><thead><tr><th>#</th><th>Question side</th><th>Answer side</th></tr></thead><tbody>';
  rows.forEach((r,i)=>{html+=`<tr><td>${i+1}</td><td>${r[0]||''}</td><td>${r[1]||''}</td></tr>`});
  html+='</tbody></table>'; document.getElementById('out').innerHTML=html;
  if(window.MathJax) MathJax.typesetPromise();
}
function shuffleRows(){
  const rows=parseCSV(document.getElementById('csv').value);
  for(let i=rows.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [rows[i],rows[j]]=[rows[j],rows[i]];}
  document.getElementById('csv').value=rows.map(r=>`"${r[0].replaceAll('"','""')}","${r[1].replaceAll('"','""')}"`).join('
'); generate();
}
generate();
</script></body></html>

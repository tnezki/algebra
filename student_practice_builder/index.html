<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algebra 1 Student Practice Builder</title><style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;line-height:1.48;background:#f2f6fa;color:#1b3950;margin:0}main{max-width:920px;margin:24px auto;padding:0 16px}.card{background:white;border:1px solid #d1e0e9;border-radius:12px;padding:22px;margin:14px 0}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#526a7b}.links{display:flex;gap:12px;flex-wrap:wrap}a,button{color:#1d5c81}a{font-weight:600}button,.action{background:#215b80;color:white;border:0;border-radius:8px;padding:10px 15px;font-size:15px;font-weight:700;cursor:pointer;text-decoration:none}.q{border-top:1px solid #d5e3ea;padding:16px 0;break-inside:avoid}.problem{font-size:16px}.problem p{margin:8px 0}.solution-button{margin-top:8px}.topic{font-size:18px;color:#254b66}.data-table{border-collapse:collapse;margin:8px auto}.data-table th,.data-table td{border:1px solid #9cafbb;padding:6px 10px;text-align:center}img.graph,img.bank-graph,img.bank-tiles{max-width:100%;height:auto;display:block;margin:12px auto;max-height:340px}.skill-choices{max-height:390px;overflow:auto;display:grid;gap:5px}.skill-check{display:flex;align-items:flex-start;gap:11px;padding:9px;border:1px solid #d8e5ec;border-radius:8px}.skill-check input{width:18px;height:18px;flex-shrink:0}.skill-check span{display:grid;gap:2px}.skill-check small{font-size:11px;color:#587289}.skill-check strong{font-size:14px}dialog{width:min(760px,calc(100% - 24px));max-height:85vh;border:1px solid #aac0d2;border-radius:12px;box-shadow:0 10px 55px #2345;padding:0}dialog::backdrop{background:#1529389e}#questions .q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}#questions .q-head .solution-button{margin:0;flex:0 0 auto}.dialog-head{position:sticky;top:0;background:white;border-bottom:1px solid #ddd;padding:15px 18px;display:flex;align-items:center;justify-content:space-between}.dialog-body{padding:15px 20px;max-height:70vh;overflow-y:auto}.dialog-close{background:#eef2f7;color:#1d4666}.list{padding:0;list-style:none}.list li{padding:14px 0;border-top:1px solid #dae4ea}@media print{body{background:white;color:black}main{max-width:none;margin:0;padding:0}.card{border:0;padding:0;margin:0}.nav,.solution-button,dialog,.no-print{display:none!important}.q{padding:10px 0}h1{font-size:21px}h2{font-size:17px}}</style><script>window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};</script><script defer src="./tex-mml-svg.js" onerror="if(!window.__practiceMathFallback){window.__practiceMathFallback=1;var m=document.createElement('script');m.src='https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js';document.head.append(m);}"></script><script defer src="./practice_variations.js"></script></head><body><main><section class="card no-print"><h1>Algebra 1 · Student Practice Builder</h1><p class="muted">Choose the I Can statements you want to practice. Create a new set or regenerate another version. This builder does not collect names, grades, or student information.</p><div id="skillOptions" class="skill-choices"></div><div class="links" style="align-items:center;margin-top:15px"><label for="count">Questions per I Can:</label><select id="count" style="padding:9px"><option>1</option><option>2</option><option>3</option><option selected>4</option></select><button id="create">Create Practice</button><button id="redo" disabled>Regenerate</button><button onclick="window.print()">Print</button></div><p id="status" class="muted" aria-live="polite">Loading teacher-approved question bank…</p></section><div id="questions"></div></main><dialog id="worked"><div class="dialog-head"><b>Worked Solution</b><button class="dialog-close" type="button" onclick="document.getElementById('worked').close()">Close</button></div><div id="workedContent" class="dialog-body"></div></dialog><script>
async function showSolution(id){
 const row=document.getElementById('q'+id);
 const answer=document.getElementById('s'+id);
 const source=document.getElementById('rawPrompt'+id);
 if(!row||!answer)return;
 const content=document.getElementById('workedContent');
 // Recreate from original TeX, not cloned MathJax SVG/HTML. Some SVG glyphs
 // depend on definitions belonging to the original page fragment.
 if(window.MathJax?.typesetClear)window.MathJax.typesetClear([content]);
 const prompt=source?.innerHTML||row.querySelector('.problem')?.innerHTML||'';
 content.innerHTML='<div class="problem">'+prompt+'</div><hr>'+answer.innerHTML;
 document.getElementById('worked').showModal();
 // MathJax may still be initializing on an iPad when a student taps Solution.
 if(!window.MathJax?.typesetPromise)return;
 try{await window.MathJax.startup.promise;await window.MathJax.typesetPromise([content]);}
 catch(_){/* leave the original text available if the browser's math renderer fails */}
}
</script><script>
let pool=null;const host=document.getElementById('skillOptions'),status=document.getElementById('status');
function pick(list,n){let a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{const r=await fetch('./question_pool.json');if(!r.ok)throw Error('Question pool not found');pool=await r.json();const entries=Object.entries(pool.skills).filter(([id,v])=>v.questions.length);host.innerHTML=entries.map(([id,v],i)=>'<label class="skill-check"><input type="checkbox" value="'+escapeHTML(id)+'" '+(!i?'checked':'')+'><span><small>'+escapeHTML(id)+'</small><strong>'+escapeHTML(v.label)+'</strong></span></label>').join('');host.querySelectorAll('input').forEach(input=>input.onchange=()=>{const ids=selected();if(ids.length>5){input.checked=false;status.textContent='Choose up to five I Cans at a time.';}});status.textContent='Ready. Choose up to five skills and create practice.'}catch(e){status.textContent='Unavailable: '+e.message}}
function selected(){return [...host.querySelectorAll('input:checked')].map(x=>x.value)}
function render(){if(!pool)return;const ids=selected();if(!ids.length){status.textContent='Choose at least one I Can.';return;}const count=Number(document.getElementById('count').value);let number=0;document.getElementById('questions').innerHTML=ids.map(id=>{const q=pick(pool.skills[id].questions,count);return '<section class="card"><h2>'+escapeHTML(pool.skills[id].label)+'</h2>'+q.map(item=>{const i=++number;return '<div class="q" id="q'+i+'" data-practice-i-can="'+escapeHTML(id)+'" data-family-id="'+escapeHTML(item.id)+'"><div class="q-head"><b>Question '+i+'</b><button class="new-version-button no-print" onclick="CPMStudentPractice.newQuestion('+i+')">New Version</button><button class="solution-button no-print" onclick="showSolution('+i+')">Solution</button></div><div class="problem">'+item.prompt+'</div><template id="rawPrompt'+i+'">'+item.prompt+'</template><div id="s'+i+'" hidden><b>Answer:</b> '+escapeHTML(item.answer)+'<p><b>Worked solution:</b> '+escapeHTML(item.solution)+'</p></div></div>'}).join('')+'</section>'}).join('');document.getElementById('redo').disabled=false;status.textContent='New '+number+'-question version created. Use New Version beside any question for another example.';if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('questions')]).catch(()=>{});}
document.getElementById('create').onclick=render;document.getElementById('redo').onclick=render;load();
</script></body></html>

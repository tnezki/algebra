/* Algebra 1 worksheet typography authority.
   Match notes_alg.css: body Times New Roman 16px/1.5, headings Arial,
   MathJax CommonHTML. Other UI CSS does not own worksheet typography.
   CPM source TeX / MathML is re-typeset, never a copied MathJax SVG.
*/
.pages .paper .print-card,
.pages .paper .print-card-body,
.pages .paper .print-card-body :is(p,li,ol,ul,div,span,td,th,blockquote,em,strong,b,i):not(mjx-container *) {
  font-family:"Times New Roman",Times,serif!important;
}
.pages .paper .print-card{font-size:12pt;line-height:1.5;color:#202020}
.pages .paper .print-card-body p{line-height:1.5;margin:.45em 0}
.pages .paper :is(.lesson-print-heading,.lesson-section-divider,.card-display-title,.lesson-print-kicker,.source-problem-label,.teacher-guide-print h2,.subpart-label) {
  font-family:Arial,Helvetica,sans-serif!important;
}
/* MathJax handles math fonts independently. It must not inherit text overrides. */
.pages .paper mjx-container[jax="CHTML"]{font-size:1em;margin:0 .03em}
.pages .paper mjx-container[jax="SVG"] svg{display:inline!important;width:auto!important;height:auto!important;max-height:none!important;margin:0!important}
.pages .paper .print-card-body math{font-family:math;display:inline}
/* Only original alphabetic lists are lettered; numbered instructions stay numbered. */
.pages .paper .print-card-body ol[type="a" s]{list-style-type:lower-alpha!important}
.pages .paper .print-card-body ol[type="A" s]{list-style-type:upper-alpha!important}
.pages .paper .print-card-body ol[type="i" s]{list-style-type:lower-roman!important}
.pages .paper .print-card-body ol[type="I" s]{list-style-type:upper-roman!important}
.pages .paper .print-card-body ol[type="1"],
.pages .paper .print-card-body ol:not([type]){list-style-type:decimal!important}
.pages .paper .print-card-body ol{padding-left:.3em;margin:.48em 0 .35em 1.65em}
.pages .paper .print-card-body ol>li{padding-left:.2em;margin:.28em 0}
.pages .paper .print-card-body ul.plain:empty{display:none!important}
/* Preserve CC3's compact colored section bars. */
.pages .paper .lesson-section-divider{
 background:#eaf3f9!important;color:#1d557d!important;
 border:0!important;border-left:4pt solid #143960!important;
 border-bottom:1pt solid #bad0e0!important;
 padding:6pt 9pt!important;margin:13pt 0 9pt!important;
 font:800 11pt/1.28 Arial,Helvetica,sans-serif!important;
 text-transform:uppercase;letter-spacing:.035em;break-after:avoid;
 -webkit-print-color-adjust:exact;print-color-adjust:exact;
}
.pages .paper .print-card.pagination-fragment{break-inside:auto!important;page-break-inside:auto!important}
.pages .paper .print-card-body :is(img,svg,math,table){break-inside:avoid;page-break-inside:avoid}
.rich-editable{font-family:"Times New Roman",Times,serif!important;font-size:16px;line-height:1.5}
@media print{.pages .paper{box-shadow:none}.pages .paper .lesson-section-divider{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

/* Source and teacher-created value tables: center content consistently.
   Keep this in worksheet_print.css for preview, offline HTML and saved PDF. */
.pages .paper .print-card-body table :is(th,td),
.pages .paper .print-card-body table :is(th,td) :is(p,div,span) {
  text-align:center!important;vertical-align:middle!important;
}
/* Consistent CPM table baseline (Assessment, Lesson, and Activities):
   centered content, readable spacing, matching border tone. */
.pages .paper .print-card-body table{border-collapse:collapse;max-width:100%}
.pages .paper .print-card-body table :is(th,td){
  border:1px solid #8d9eac;padding:5px;
  text-align:center!important;vertical-align:middle!important;
}


/* CPM original tile tables are rendered as vector squares, with no visible
   screen-reader labels and no dependency on captured cell-border CSS. */
.pages .paper .print-card-body svg.cpm-tile-diagram{
 display:block;max-width:100%;height:auto;margin:3pt auto 1pt;
 break-inside:avoid;page-break-inside:avoid;
}
.pages .paper .print-card-body div:has(> div > svg.cpm-tile-diagram){
 display:flex;flex-wrap:wrap;justify-content:space-around;align-items:flex-end;gap:9pt;
}
.pages .paper .print-card-body div:has(> div > svg.cpm-tile-diagram)>div{
 flex:0 1 auto;text-align:center;break-inside:avoid;
}

/* CPM tile patterns: match the textbook's three bottom-aligned figures,
   never a full rectangular grid. Keep the links legible in saved HTML/PDF. */
.pages .paper .print-card-body .cpm-tile-group,
.pages .paper .print-card-body div:has(> div > svg.cpm-tile-diagram){

 gap:9pt;width:100%;margin:8pt auto 6pt;
}
.pages .paper .print-card-body .cpm-tile-group>.cpm-tile-panel,
.pages .paper .print-card-body div:has(> div > svg.cpm-tile-diagram)>div{

}
.pages .paper .print-card-body .cpm-tile-panel svg.cpm-tile-diagram,
.pages .paper .print-card-body div:has(> div > svg.cpm-tile-diagram)>div>svg.cpm-tile-diagram{
 display:block;width:auto;max-width:100%;height:auto;max-height:none;
 margin:0 auto 3pt;
}
.pages .paper .print-card-body .cpm-tile-panel>p{margin:2pt 0 0!important;text-align:center!important;}
.pages .paper .print-card-body a[href]{color:#185ba5!important;text-decoration:underline!important;}

/* The former directions textarea is now an ordinary movable teacher-only card.

}
.pages .paper .printable-kind-teacher-directions .print-card-body p{

}

/* v88 teacher-approved readable value table, single formatting authority.
   Applies to editor, bank preview, all five assessment types and all shared
   builder previews, offline student/teacher HTML, and flattened PDFs.

.pages .paper .print-card-body table :is(th,td),
.pages .paper .question table :is(th,td),
.assessment-export-stage .paper .question table :is(th,td),
.rich-editable table :is(th,td),
.question .data-table :is(th,td){

.pages .paper .print-card-body table :is(th,td) :is(p,div,span),
.pages .paper .question table :is(th,td) :is(p,div,span),
.assessment-export-stage .paper .question table :is(th,td) :is(p,div,span),

.pages .paper .print-card-body table th,
.pages .paper .question table th,
.assessment-export-stage .paper .question table th,

   (last && last.getBoundingClientRect().bottom>edge+2 &&

// As an emergency fallback, split a genuinely page-long paragraph at word

// Range.cloneContents preserves formatted spans, SVG and MathML in each part.
function divideLargeParagraph(unit){

  const r=document.createRange();r.setStart(boundaries[i].node,boundaries[i].end);r.setEnd(boundaries[i+1].node,boundaries[i+1].end);

  if(piece.textContent.trim()||piece.querySelector('img,svg,math,mjx-container'))result.push({trail:unit.trail,node:piece});

function paginatePieces(pieces, createPage){

  const media=[...fragment.querySelectorAll('.print-card-body img,.print-card-body svg')].filter(n=>!n.closest('mjx-container'));

  const largest=media.reduce((a,b)=>b.getBoundingClientRect().height>a.getBoundingClientRect().height?b:a);

  const free=page.inner.getBoundingClientRect().bottom-top-(fragment.getBoundingClientRect().height-rect.height)-20;
  if(free<60||rect.height<free+2||rect.width<1)return false;
  const factor=Math.max(.1,Math.min(.98,free/rect.height));
  const figures=unit.node.nodeType===Node.ELEMENT_NODE?[...unit.node.querySelectorAll('img,svg')]:[];
  if(unit.node.nodeType===Node.ELEMENT_NODE && unit.node.matches('img,svg'))figures.unshift(unit.node);

  if(!target)return false;
  target.style.setProperty('width',Math.max(1,Math.floor(rect.width*factor))+'px','important');

  target.style.setProperty('max-height',Math.max(1,Math.floor(free))+'px','important');

   if(++tries>Math.max(160,queue.length*15))throw Error('Page-flow safety limit: unusually long or malformed question.');

   }

   if(count){fragment.remove();startNext();continued=true;

   const divided=divideLargeParagraph(unit);
   if(divided){fragment.replaceWith(makePageFragment(card,[],continued,false));fragment=page.inner.lastElementChild;

    resized.add(unit.node);fragment.replaceWith(makePageFragment(card,[],continued,false));

   }

}

// Uses the installed Assessment Builder's page_flow.js and worksheet_print.css.
// Printed questions are reconstructed from the original prompt templates so
// MathJax never clones detached SVG glyph definitions from screen fragments.
let studentPracticePrinting=false;
async function prepareStudentWorksheet(){
 if(studentPracticePrinting)return;
 const rows=[...document.querySelectorAll('#questions .q')];
 if(!rows.length){status.textContent='Create a practice set before printing.';return false;}
 const root=document.getElementById('practicePages');
 const button=document.getElementById('printWorksheet');
 studentPracticePrinting=true;button.disabled=true;
 status.textContent='Preparing measured worksheet pages and mathematics for printing…';
 try{
   if(!window.CPMPageFlow)throw Error('Shared assessment page-flow engine unavailable');
   for(let tries=0;tries<150&&!window.MathJax?.typesetPromise;tries++)
     await new Promise(resolve=>setTimeout(resolve,100));
   if(!window.MathJax?.startup?.promise||!window.MathJax?.typesetPromise)
     throw Error('Mathematics renderer unavailable');
   await window.MathJax.startup.promise;
   if(window.MathJax.typesetClear)window.MathJax.typesetClear([root]);
   root.replaceChildren();
   const source=document.createElement('div');
   source.className='practice-unpaged';source.id='practiceUnpaged';
   let lastSkill='';const blocks=[];
   rows.forEach((row,index)=>{
     const skill=row.dataset.practiceICan;
     const label=pool?.skills?.[skill]?.label||skill;
     if(skill!==lastSkill){
       blocks.push('<div class="lesson-section-divider">'+escapeHTML(label)+'</div>');
       lastSkill=skill;
     }
     const prompt=document.getElementById('rawPrompt'+(index+1))?.innerHTML||row.querySelector('.problem')?.innerHTML||'';
     blocks.push('<article class="print-card question-card"><div class="question-top"><strong>'+(index+1)+'.</strong><span class="question-skill">'+escapeHTML(label)+'</span></div><div class="print-card-body question figure-lesson-size"><div class="problem">'+prompt+'</div></div><div class="question-workspace workspace" style="height:96pt"></div></article>');
   });
   source.innerHTML=blocks.join('');root.append(source);
   await window.MathJax.typesetPromise([source]);
   await window.CPMPageFlow.ready(source);
   const pieces=[...source.children].map(n=>n.cloneNode(true));
   let pageNo=0;
   function nextPage(continued){
     pageNo++;
     const paper=document.createElement('section');paper.className='paper';paper.dataset.page=String(pageNo);
     const inner=document.createElement('div');inner.className='paper-inner';
     const header=document.createElement('header');header.className='sheet-heading'+(continued?' continued':'');
     header.innerHTML=continued
       ? '<span class="sheet-kicker">ALGEBRA 1 · STUDENT PRACTICE</span><span>Continued</span>'
       : '<div class="sheet-kicker">ALGEBRA 1 · STUDENT PRACTICE</div><div class="sheet-title">Practice Worksheet</div><div class="sheet-meta">'+rows.length+' questions · Name: ___________________________ · Date: __________</div>';
     inner.append(header);paper.append(inner);
     const footer=document.createElement('span');footer.className='sheet-footer';footer.textContent='Page '+pageNo;
     paper.append(footer);root.append(paper);return {paper,inner};
   }
   window.CPMPageFlow.paginatePieces(pieces,nextPage);
   source.remove();
   window.CPMPageFlow.assertPages(root);
   for(const paper of root.querySelectorAll(':scope > .paper'))paper.querySelector('.sheet-footer').textContent+=' of '+pageNo;
   status.textContent='Worksheet ready: '+rows.length+' questions on '+pageNo+' page'+(pageNo===1?'':'s')+'.';
   return true;
 }catch(error){
   root.replaceChildren();
   status.textContent='Cannot print safely: '+String(error?.message||error)+'. No clipped worksheet was printed.';
   return false;
  }finally{studentPracticePrinting=false;button.disabled=false;}
}
async function printStudentWorksheet(){
 if(window.waitForSharePreparation)await window.waitForSharePreparation();
 const ready=await prepareStudentWorksheet();
 if(ready)window.print();
}
</script><script>
let pool=null,activeGoal='All LGs',activePlanFile='question_pool.json',availablePlans=[];
const host=document.getElementById('skillOptions'),status=document.getElementById('status');
const tabs=document.getElementById('goalTabs'),summary=document.getElementById('selectionSummary');
const selectedSkills=new Set();
const planPicker=document.getElementById('assessmentPlan');
function pick(list,n){let a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a.slice(0,n)}

 tabs.innerHTML=[...groups,'All LGs'].map(goal=>{
   const n=goal==='All LGs'?selectedSkills.size:selected().filter(id=>goalOf(id)===goal).length;
   const label=goal==='All LGs'?'All LGs':goal;
   return '<button type="button" class="goal-tab" aria-pressed="'+(goal===activeGoal)+'" data-goal="'+escapeHTML(goal)+'">'+escapeHTML(label)+(n?' ('+n+')':'')+'</button>';
 }).join('');
 tabs.querySelectorAll('button').forEach(b=>b.onclick=()=>showGoal(b.dataset.goal));
 const term=document.getElementById('skillSearch').value.trim().toLowerCase();
 const entries=allSkills().filter(([id,v])=>
   (term || activeGoal==='All LGs' || goalOf(id)===activeGoal) &&
   (!term || (id+' '+v.label).toLowerCase().includes(term)));
 host.innerHTML=entries.map(([id,v])=>'<label class="skill-check"><input type="checkbox" value="'+escapeHTML(id)+'" '+(selectedSkills.has(id)?'checked':'')+'><span><small>'+escapeHTML(id)+'</small><strong>'+escapeHTML(v.label)+'</strong></span></label>').join('') || '<p class="muted">No matching I Can statements.</p>';
 host.querySelectorAll('input').forEach(input=>input.onchange=()=>{
   if(input.checked){
     if(selectedSkills.size>=5){input.checked=false;status.textContent='Choose up to five I Cans at a time.';return;}
     selectedSkills.add(input.value);
   }else selectedSkills.delete(input.value);
   renderSelector();
 });
 const n=selectedSkills.size;
 summary.textContent=n+' of 5 selected'+(n?' · '+selected().join(' · '):' · Choose an I Can to begin.');
}
async function loadPlan(file){
 if(!/^(?:question_pool\.json|question_pool_ap(?:[2-9]|[1-9][0-9]+)\.json)$/.test(file))throw Error('Unrecognized assessment plan pool.');
 const r=await fetch('./'+file,{cache:'no-store'});if(!r.ok)throw Error('Approved plan pool unavailable');
 const next=await r.json();if(next.schema!=='cpm-public-practice-bank/1'||!next.skills||!Object.keys(next.skills).length)throw Error('Invalid approved plan question pool.');
 pool=next;activePlanFile=file;selectedSkills.clear();activeGoal='All LGs';
 document.getElementById('questions').replaceChildren();
 document.getElementById('practicePages').replaceChildren();

 document.getElementById('printWorksheet').disabled=true;
 document.getElementById('notability').disabled=true;

}
async function load(){
 try{
  const r=await fetch('./assessment_plans.json',{cache:'no-store'});

  if(manifest.schema!=='cpm-public-practice-plans/1'||!Array.isArray(manifest.plans))throw Error('Invalid assessment plan list');
  availablePlans=manifest.plans.filter(p=>/^AP[1-9][0-9]*$/.test(p.id)&&/^(?:question_pool\.json|question_pool_ap(?:[2-9]|[1-9][0-9]+)\.json)$/.test(p.pool));
  if(!availablePlans.length)throw Error('No approved assessment plans are published');

}
planPicker.onchange=async()=>{
 try{const choice=availablePlans.find(p=>p.id===planPicker.value);if(!choice)throw Error('Invalid plan');await loadPlan(choice.pool)}
 catch(e){status.textContent='Cannot load assessment plan: '+e.message}

function render(){

 document.getElementById('questions').innerHTML=ids.map(id=>{
   const q=pick(pool.skills[id].questions,count);
   return '<section class="card"><h2>'+escapeHTML(pool.skills[id].label)+'</h2>'+q.map(item=>{
     const i=++number;
     return '<div class="q" id="q'+i+'" data-practice-i-can="'+escapeHTML(id)+'" data-practice-pool="'+escapeHTML(activePlanFile)+'" data-family-id="'+escapeHTML(item.id)+'"><div class="q-head"><b>Question '+i+'</b><div class="question-actions"><button type="button" class="new-version-button no-print" onclick="CPMStudentPractice.newQuestion('+i+')">New Version</button><button type="button" class="solution-button no-print" onclick="showSolution('+i+')">Solution</button></div></div><div class="problem">'+item.prompt+'</div><template id="rawPrompt'+i+'">'+item.prompt+'</template><div id="s'+i+'" hidden><b>Answer:</b> '+escapeHTML(item.answer)+'<p><b>Worked solution:</b> '+escapeHTML(item.solution)+'</p></div></div>'
   }).join('')+'</section>';
 }).join('');
 document.getElementById('redo').disabled=false;
 document.getElementById('printWorksheet').disabled=false;
 document.getElementById('notability').disabled=false;
 document.getElementById('practicePages').replaceChildren();
 if(window.scheduleStudentSharePDF)window.scheduleStudentSharePDF();
 status.textContent='New '+number+'-question version created. Use New Version beside any question for another example.';
 if(window.MathJax?.typesetPromise)MathJax.typesetPromise([document.getElementById('questions')]).catch(()=>{});
}
function shareStudentWorksheet(){
 if(window.sharePracticePDF)window.sharePracticePDF();
 else {status.textContent='PDF sharing is unavailable. Opening the device print/PDF screen.';printStudentWorksheet();}
}
document.getElementById('skillSearch').oninput=renderSelector;
document.getElementById('clearSkills').onclick=()=>{selectedSkills.clear();renderSelector()};
document.getElementById('create').onclick=render;
document.getElementById('redo').onclick=render;
load();
</script></body></html>

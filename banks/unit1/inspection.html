<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Unit 1 Bank Inspection</title><style>body{font-family:system-ui;max-width:800px;margin:40px auto;padding:0 18px}pre{background:#f5f5f5;padding:12px;white-space:pre-wrap}.ok{padding:10px;background:#eef8ef;border:1px solid #7a8;border-radius:8px}</style></head><body><h1>Algebra 1 · Unit 1 Bank Inspection</h1><p><a href="./unit1.html">Open full teacher inspection viewer</a></p><div id="status">Loading…</div><script>Promise.all([fetch('./BANK_MANIFEST.json').then(r=>r.json()),fetch('./MAP_FIDELITY_REPORT.json').then(r=>r.json())]).then(([m,q])=>{document.querySelector('#status').innerHTML=`<div class="ok"><b>${m.status}</b> · ready_for_downstream=${m.ready_for_downstream} · qa=${m.qa_status} · mismatch_count=${q.mismatch_count}<br>Questions: ${m.record_counts.question_records} · Seeds: ${m.record_counts.seeds}<br>Map: ${m.accepted_map_fingerprint}</div>`}).catch(e=>document.querySelector('#status').textContent='Inspection load error: '+e.message)</script></body></html>

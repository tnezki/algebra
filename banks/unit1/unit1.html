<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Algebra 1 · Unit 1 Bank Inspection</title>
<script>
window.MathJax={tex:{inlineMath:[['\\(','\\)']],displayMath:[['\\[','\\]']]},svg:{fontCache:'global'}};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<style>
:root{color-scheme:light dark;--bg:#f5f6f8;--card:#fff;--fg:#17191c;--muted:#626870;--line:#c9cdd3;--chip:#eef0f3;--accent:#244a78}
@media(prefers-color-scheme:dark){:root{--bg:#111318;--card:#1b1f26;--fg:#edf0f4;--muted:#aeb5bf;--line:#444b56;--chip:#292f38;--accent:#92b8e8}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}.wrap{max-width:1280px;margin:auto;padding:18px}.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);padding:10px 0}.tabs,.filters,.totals{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tabs button,.filters select,.filters input{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:8px;padding:8px 10px}.tabs button.active{outline:2px solid var(--accent)}.filters input{min-width:280px}.totals{margin:10px 0}.total{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:7px 10px;min-width:108px}.total b{display:block;font-size:18px}.grid{display:grid;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}.meta-compact{font:12px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted);overflow-wrap:anywhere;margin-bottom:8px}.ican{font-weight:650;margin:5px 0 10px}.student{padding:10px 0}.values{border-collapse:collapse;width:auto;max-width:100%;margin:8px 0}.values th,.values td{border:1px solid #777;min-width:52px;padding:7px 11px;text-align:center}.split{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}.split>.values{flex:0 0 auto;align-self:flex-start}.representation{max-width:560px}.graph-img{display:block;max-width:100%;height:auto;object-fit:contain}.equation-card{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:6px 0}details{margin-top:8px;border-top:1px solid var(--line);padding-top:8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.blueprint{border-left:4px solid var(--accent)}.notice{padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card);margin:10px 0}.hidden{display:none!important}
</style>
</head>
<body><div class="wrap">
<h1>Algebra 1 · Unit 1 Bank Inspection</h1>
<div class="notice">Teacher inspection surface. Secure Summative prompts, stimuli, keys, and solutions are intentionally not rendered here.</div>
<div class="top">
  <div class="tabs" id="tabs"></div>
  <div class="filters"><label>Section <select id="section"><option value="">All</option></select></label><input id="search" type="search" placeholder="Search ID, I Can, structure, representation, prompt…"></div>
  <div class="totals" id="totals"></div>
</div>
<div id="status" class="notice">Loading bank files…</div>
<div id="cards" class="grid"></div>
</div>
<script>
const SOURCES={Practice1:'practice1.json',Exit:'exit.json',WTC:'wtc.json',Seeds:'seeds.json',Summative:'summative_secure.json',BuildQA:'BANK_MANIFEST.json'};
const LABELS={Practice1:'Practice 1',Exit:'Exit',WTC:'WTC',Seeds:'Seeds',Summative:'Summative blueprint',BuildQA:'Build/QA'};
const state={data:{},tab:'Practice1'};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=(o,...ks)=>ks.map(k=>o?.[k]).find(v=>v!==undefined&&v!==null&&v!=='')??'';
function icLabel(id){const m=String(id||'').match(/(?:^|-)IC(\d+)$/i);return m?`IC${m[1]}`:'I Can'}
function recordsFor(tab){const d=state.data[tab]||{}; if(tab==='Summative') return d.blueprint||[]; return d.records||d.seeds||[]}
function sections(){const s=new Set();['Practice1','Exit','WTC'].forEach(t=>recordsFor(t).forEach(r=>{if(r.section_id)s.add(r.section_id)}));return [...s].sort()}
function compact(r){return [val(r,'record_id','seed_id', 'slot'),val(r,'stage','role'),val(r,'target_id','mastery_goal_id'),val(r,'primary_i_can_id'),val(r,'selected_question_structure_id'),val(r,'representation_mode')].filter(Boolean).join(' · ')}
function readableIC(r){const id=val(r,'primary_i_can_id');const txt=val(r,'primary_i_can_text','evidence_job');return id||txt?`${icLabel(id)} — ${txt||id}`:''}
function card(r,tab){
 if(tab==='Summative') return `<article class="card blueprint"><div class="meta-compact">${esc([r.slot,r.mastery_goal_id,r.primary_i_can_id,r.selected_question_structure_id].filter(Boolean).join(' · '))}</div><div class="ican">${esc(r.evidence_job||'Secure evidence slot')}</div><p>Estimated time: ${esc(r.estimated_minutes||'—')} min</p><details><summary>Safe blueprint / lineage metadata</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details></article>`;
 const html=val(r,'student_html') || (tab==='Seeds'?`<p><b>${esc(val(r,'title','seed_id'))}</b></p><p>${esc(val(r,'preserve','why_useful'))}</p>`:`<p>${esc(val(r,'student_text','title'))}</p>`);
 const ans=val(r,'answer','solution_text','scoring_criteria');
 return `<article class="card" data-section="${esc(r.section_id||'')}"><div class="meta-compact">${esc(compact(r))}</div>${readableIC(r)?`<div class="ican">${esc(readableIC(r))}</div>`:''}<div class="student">${html}</div>${ans?`<details><summary>Answer / solution</summary><div>${r.solution_html||`<p>${esc(ans)}</p>`}</div></details>`:''}<details><summary>Complete metadata / map trace</summary><pre>${esc(JSON.stringify(r,null,2))}</pre></details></article>`;
}
async function load(){
 const entries=Object.entries(SOURCES); const got=await Promise.all(entries.map(async([k,p])=>{try{const r=await fetch(p,{cache:'no-store'});if(!r.ok)throw Error(`${r.status} ${r.statusText}`);return [k,await r.json(),null]}catch(e){return[k,null,String(e)]}}));
 const errs=[]; got.forEach(([k,d,e])=>{if(d)state.data[k]=d;if(e)errs.push(`${SOURCES[k]}: ${e}`)});
 for(const q of ['MAP_FIDELITY_REPORT.json','RENDER_QA_REPORT.json']){try{const r=await fetch(q,{cache:'no-store'});if(r.ok)state.data[q]=await r.json()}catch{}}
 $('#status').textContent=errs.length?`Loaded with missing files: ${errs.join(' | ')}`:'Bank files loaded.'; setup(); render();
}
function setup(){
 const tabs=$('#tabs'); tabs.innerHTML='';Object.keys(SOURCES).forEach(k=>{const b=document.createElement('button');b.textContent=LABELS[k];b.dataset.tab=k;b.onclick=()=>{state.tab=k;render()};tabs.appendChild(b)});
 const sel=$('#section');sections().forEach(s=>{const o=document.createElement('option');o.value=s;o.textContent=s;sel.appendChild(o)});sel.onchange=render;$('#search').oninput=render;
}
function renderTotals(){const counts={Practice:recordsFor('Practice1').length,Exit:recordsFor('Exit').length,Summative:(state.data.Summative?.forms?.length?state.data.Summative.forms.reduce((n,f)=>n+(f.records?.length||0),0):48),WTC:recordsFor('WTC').length,Seeds:recordsFor('Seeds').length};const total=counts.Practice+counts.Exit+counts.Summative+counts.WTC;const qa=state.data['RENDER_QA_REPORT.json']?.status||state.data.BuildQA?.qa_status||'—';$('#totals').innerHTML=[['Questions/tasks',total],...Object.entries(counts),['QA',qa]].map(([k,v])=>`<div class="total"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join('')}
function render(){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));renderTotals();const sec=$('#section').value;const q=$('#search').value.trim().toLowerCase();let html='';if(state.tab==='BuildQA'){const payload={BANK_MANIFEST:state.data.BuildQA||null,MAP_FIDELITY_REPORT:state.data['MAP_FIDELITY_REPORT.json']||null,RENDER_QA_REPORT:state.data['RENDER_QA_REPORT.json']||null};html=`<article class="card"><pre>${esc(JSON.stringify(payload,null,2))}</pre></article>`}else{let rs=recordsFor(state.tab);rs=rs.filter(r=>(!sec||r.section_id===sec)&&(!q||JSON.stringify(r).toLowerCase().includes(q)));html=rs.map(r=>card(r,state.tab)).join('')||'<div class="notice">No matching records.</div>'}$('#cards').innerHTML=html;if(window.MathJax?.typesetPromise)MathJax.typesetPromise([$('#cards')]).catch(()=>{})}
load();
</script></body></html>

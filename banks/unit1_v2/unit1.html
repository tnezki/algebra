<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Algebra 1 Unit 1 Bank</title><style>
:root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#171717;background:#f4f4f1}body{margin:0}.wrap{max-width:1180px;margin:auto;padding:24px 18px 60px}h1{margin:.2rem 0}.sub{color:#555}.warn{padding:12px;border-radius:10px;background:#fee;border:1px solid #c44;margin:14px 0}.ok{background:#eef8ef;border-color:#5a7}.toolbar{position:sticky;top:0;background:#f4f4f1f2;padding:10px 0;display:flex;gap:7px;flex-wrap:wrap;z-index:5;border-bottom:1px solid #ccc}button,input,select{font:inherit;padding:8px 10px;border:1px solid #bbb;border-radius:8px;background:white}button.active{font-weight:700;border-color:#111}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:15px 0}.stat,.card{background:#fff;border:1px solid #d6d6d1;border-radius:11px;padding:13px}.stat b{font-size:1.35rem;display:block}.card{margin:9px 0}.meta{display:flex;flex-wrap:wrap;gap:5px 10px;color:#666;font-size:.8rem}.pill{background:#eee;padding:2px 7px;border-radius:999px}.prompt{font-weight:650;margin:9px 0}.stage{margin:22px 0 8px;padding:7px 11px;border-left:5px solid #333;background:#e7e7e3}.values{border-collapse:collapse;margin:10px 0}.values th,.values td{border:1px solid #777;padding:6px 9px}.graph,.number-line{max-width:420px;width:100%;height:auto}.split{display:flex;flex-wrap:wrap;gap:14px}.split>*{flex:1 1 320px}.response-surface,.context-box,.mapping,.rep-card,.math-card,.worked{border:1px dashed #aaa;border-radius:8px;padding:9px;margin:8px 0}.answer{border-top:1px dashed #bbb;margin-top:10px;padding-top:8px}.answer summary{cursor:pointer;font-weight:650}.secure{border-left:5px solid #7b1e1e}.seed{border-left:5px solid #666}.qa pre{white-space:pre-wrap;font-size:.82rem;background:#fafafa;padding:10px;border-radius:8px;overflow:auto}.hidden{display:none}@media print{.toolbar{display:none}.card{break-inside:avoid}.answer{display:none}}
</style></head><body><main class="wrap"><h1>Algebra 1 · Unit 1 Complete Bank</h1><div class="sub" id="meta">Loading local Bank files…</div><div id="banner" class="warn">Loading QA status…</div><div class="toolbar"><button data-view="practice" class="active">Practice 1</button><button data-view="exit">Exit</button><button data-view="wtc">WTC</button><button data-view="seeds">Seeds</button><button data-view="summative">Summative blueprint</button><button data-view="qa">Build / QA</button><select id="sec"><option value="all">All sections</option><option>1.1</option><option>1.2</option><option>1.3</option><option>1.4</option><option>1.5</option></select><input id="search" type="search" placeholder="Search non-secure bank"></div><div class="stats" id="stats"></div><div id="content"></div></main><script>
const FILES=['BANK_MANIFEST.json','MAP_FIDELITY_REPORT.json','exit.json','practice1.json','wtc.json','seeds.json','summative.json','PROVENANCE.json'];const DB={};let view='practice';
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){try{for(const f of FILES){const r=await fetch('./'+f,{cache:'no-store'});if(!r.ok)throw new Error(`${f}: HTTP ${r.status}`);DB[f]=await r.json()}ready()}catch(e){document.querySelector('#banner').textContent='VIEWER ERROR: '+e.message;document.querySelector('#meta').textContent='Could not load one or more local Bank JSON files.'}}
function ready(){const m=DB['BANK_MANIFEST.json'],q=DB['MAP_FIDELITY_REPORT.json'];document.querySelector('#meta').textContent=`${m.status} · map ${m.accepted_map_fingerprint.slice(0,12)}… · profile ${m.course_profile.version} · viewer ${m.unit_viewer_path}`;const good=m.status==='COMPLETE'&&m.ready_for_downstream&&m.qa_status==='PASS'&&q.mismatch_count===0;const b=document.querySelector('#banner');b.className='warn '+(good?'ok':'');b.textContent=good?'PASS · Complete, map-fidelity mismatch_count = 0, ready for downstream.':'WARNING · Bank is not in a complete downstream-ready state.';document.querySelector('#stats').innerHTML=[['Questions',193],['Practice',120],['Exit',20],['Summative',48],['WTC',5],['Seeds',6]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('');render()}
function match(r){const sec=document.querySelector('#sec').value,q=document.querySelector('#search').value.trim().toLowerCase();if(sec!=='all'&&r.section_id!==sec)return false;if(!q)return true;return [r.record_id,r.target_id,r.primary_i_can_id,r.student_text,r.answer].join(' ').toLowerCase().includes(q)}
function card(r){return `<article class="card"><div class="meta"><b>${E(r.record_id)}</b><span class="pill">${E(r.stage)}</span><span>${E(r.target_id)}</span><span>${E(r.primary_i_can_id)}</span><span>${E(r.question_structure_id)}</span><span>${E(r.representation_mode)}</span></div>${r.student_html||''}${r.parts?`<ol>${r.parts.map(p=>`<li><b>${E(p.label)}</b> ${E(p.student_action)}</li>`).join('')}</ol>`:''}<details class="answer"><summary>Answer & solution</summary><p><b>Answer:</b> ${E(r.answer)}</p>${r.solution_html||''}</details></article>`}
function render(){if(!DB['practice1.json'])return;const c=document.querySelector('#content');if(view==='practice'){const arr=DB['practice1.json'].records.filter(match);let h='';for(const sec of ['1.1','1.2','1.3','1.4','1.5']){const rs=arr.filter(r=>r.section_id===sec);if(!rs.length)continue;h+=`<section><h2>Section ${sec}</h2>`;for(const st of ['Intro','Review','Mastery'])h+=`<h3 class="stage">${st}</h3>`+rs.filter(r=>r.stage===st).map(card).join('');h+='</section>'}c.innerHTML=h||'<p>No matches.</p>';return}if(view==='exit'){c.innerHTML='<h2>Exit Tickets</h2>'+DB['exit.json'].records.filter(match).map(card).join('');return}if(view==='wtc'){c.innerHTML='<h2>WTC Connected Routines</h2>'+DB['wtc.json'].records.filter(match).map(card).join('');return}if(view==='seeds'){const q=document.querySelector('#search').value.toLowerCase();c.innerHTML='<h2>Approved Seeds</h2>'+DB['seeds.json'].records.filter(s=>!q||JSON.stringify(s).toLowerCase().includes(q)).map(s=>`<article class="card seed"><div class="meta"><b>${E(s.seed_id)}</b></div><h3>${E(s.title)}</h3><p><b>Preserve:</b> ${E(s.preserve)}</p><p><b>Why useful:</b> ${E(s.why_useful)}</p><p><b>May vary:</b> ${E(s.may_vary)}</p></article>`).join('');return}if(view==='summative'){const arr=DB['summative.json'].records;c.innerHTML='<div class="warn ok"><b>Security:</b> secure Summative prompts, keys, and solutions are intentionally not rendered in this public inspection viewer. Only blueprint/map-alignment metadata is shown.</div>'+[1,2,3,4,5,6].map(f=>`<section><h2>V${f} · 39-minute blueprint</h2>${arr.filter(r=>r.form===`V${f}`).map(r=>`<article class="card secure"><div class="meta"><b>${E(r.record_id)}</b><span class="pill">${E(r.blueprint_slot)}</span><span>${E(r.target_id)}</span><span>${E(r.primary_i_can_id)}</span><span>${E(r.question_structure_id)}</span><span>${E(r.representation_mode)}</span><span>${E(r.estimated_minutes)} min</span></div><p><b>Evidence job:</b> ${E(r.evidence_job)}</p><p><b>Required variation axes:</b> ${E((r.required_variation_axes||[]).join(', ')||'anchor')}</p></article>`).join('')}</section>`).join('');return}if(view==='qa'){const m=DB['BANK_MANIFEST.json'],q=DB['MAP_FIDELITY_REPORT.json'],p=DB['PROVENANCE.json'];c.innerHTML=`<section class="qa"><h2>Build / QA</h2><article class="card"><h3>Manifest</h3><pre>${E(JSON.stringify(m,null,2))}</pre></article><article class="card"><h3>Map Fidelity</h3><pre>${E(JSON.stringify({status:q.status,mismatch_count:q.mismatch_count,missing_accepted_records:q.missing_accepted_records,unexpected_authored_records:q.unexpected_authored_records},null,2))}</pre></article><article class="card"><h3>Provenance</h3><pre>${E(JSON.stringify(p,null,2))}</pre></article></section>`}}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;document.querySelector('#sec').disabled=['seeds','summative','qa'].includes(view);render()});document.querySelector('#sec').onchange=render;document.querySelector('#search').oninput=render;load();
</script></body></html>
